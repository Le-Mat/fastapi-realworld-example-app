name: Hadolint

on:
  push:
    branches:
      - "master"

  pull_request:
    branches:
      - "*"

jobs:
  hadolint:
    name: Lint Dockerfile

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning